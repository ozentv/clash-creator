# Déploiement Render : un seul service web qui sert l'API et le front compilé.
services:
  - type: web
    name: clash-creator
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: COC_API_TOKEN
        sync: false # à saisir dans le tableau de bord Render
      - key: COC_API_BASE_URL
        sync: false # proxy à IP fixe, voir README
      - key: DATABASE_URL
        sync: false # facultatif : base PostgreSQL pour ajouter des fiches depuis le site
      - key: ADMIN_PASSWORD
        sync: false # facultatif : mot de passe du mode gestion (8 caractères minimum)
